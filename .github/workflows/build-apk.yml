name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Patch build files for Kotlin 2.0 compat
        run: |
          cd android
          # 用 Gradle 8.7（自带 Kotlin 1.9.x，兼容 RN 的 Kotlin 版本）
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # gradle.properties 基础设置
          cat > gradle.properties << 'PROP'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          android.useAndroidX=true
          android.enableJetifier=true
          newArchEnabled=false
          hermesEnabled=false
          PROP

          # 在 settings.gradle 里加 Kotlin 插件版本管理
          echo '' >> settings.gradle
          echo 'pluginManagement {' >> settings.gradle
          echo '    plugins {' >> settings.gradle
          echo '        id("org.jetbrains.kotlin.android") version "2.0.21"' >> settings.gradle  
          echo '        id("com.google.devtools.ksp") version "2.0.21-1.0-28"' >> settings.gradle
          echo '    }' >> settings.gradle
          echo '}' >> settings.gradle

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: privatechat-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
