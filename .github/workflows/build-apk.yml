name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Fix Gradle version to 8.x
        run: |
          cd android
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat > gradle.properties << 'PROP'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          android.useAndroidX=true
          android.enableJetifier=true
          newArchEnabled=false
          hermesEnabled=false
          PROP

      - name: Show gradle version
        run: cd android && ./gradlew --version

      - name: Build APK (retry with debug)
        run: |
          cd android
          ./gradlew assembleRelease 2>&1 || true
          echo "=== CHECKING FOR ERRORS ==="
          cat build/reports/problems/problems-report.html 2>/dev/null | head -100
          ls -la app/build/outputs/ 2>/dev/null

      - name: Debug - show errors
        if: failure()
        run: |
          cd android
          find build/reports -name "*.html" 2>/dev/null | head -10
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No APK output"

      - name: Upload APK (if exists)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: privatechat-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
