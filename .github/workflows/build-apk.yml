name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Override settings.gradle with fixed Kotlin/KSP versions
        run: |
          cp android/settings.gradle android/settings.gradle.bak
          cp settings.gradle.patched android/settings.gradle 2>/dev/null || true

      - name: Fix Gradle to 8.7
        run: |
          cd android
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > gradle.properties << 'PROP'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          android.useAndroidX=true
          android.enableJetifier=true
          newArchEnabled=false
          hermesEnabled=false
          PROP

      - name: Build APK
        run: cd android && ./gradlew assembleRelease --no-daemon 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: privatechat-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
