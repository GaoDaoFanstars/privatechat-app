name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Patch gradle for Kotlin compatibility
        run: |
          cd android
          # 用 Gradle 9.0（自带 Kotlin 2.2）
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.0-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # 设置环境变量跳过 Kotlin metadata 版本检查
          echo "kotlin.compiler.skip-metadata-version-check=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "newArchEnabled=false" >> gradle.properties
          echo "hermesEnabled=false" >> gradle.properties

          # 在 app/build.gradle 添加 Kotlin 版本覆盖
          echo "" >> app/build.gradle
          echo "kotlin { jvmToolchain(17) }" >> app/build.gradle

      - name: Build APK with Kotlin compat flags
        env:
          KOTLIN_COMPILER_ARGS: -Xskip-metadata-version-check -Xskip-prerelease-check
          GRADLE_OPTS: -Dkotlin.compiler.skip-metadata-version-check=true
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -Dkotlin.compiler.skip-metadata-version-check=true 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: privatechat-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
